[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgx"
version = "1.0.0"
description = "CGX-1.0 frozen commissioning generalization experiment"
requires-python = ">=3.11"

[project.scripts]
cgx = "cgx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
